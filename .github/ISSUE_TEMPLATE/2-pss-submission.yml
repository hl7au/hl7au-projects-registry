name: Submit a PSS
description: Submit a work-group-approved PSS to the HL7 AU TSC for approval.
title: "PSS: "
labels: ["pss-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form once your work group has approved the project scope statement.
        It opens a pull request that adds the PSS to the registry with the status
        **Submitted**, for the AU TSC to consider.

        1. Write the scope statement on the blank
           [**HL7 AU PSS template**](https://github.com/hl7au/hl7au-projects-registry/raw/main/TEMPLATES/HL7%20AU%20PSS%20Template%201.0.docx)
           (`.docx`, from `TEMPLATES/`).
        2. Take it through your work group for approval.
        3. Export it to **PDF** and fill in this form.

        The PDF is renamed to `YYYYMMDD <Project> R<n>.pdf` from the answers
        below, so call your file whatever you like.

        If the project is not in the [registry](https://hl7au.github.io/hl7au-projects-registry/)
        yet, a new project entry is created for it — a
        [project proposal](?template=1-pp-submission.yml) still needs to follow.

  - type: input
    id: project
    attributes:
      label: Project
      description: The registry project ID (e.g. `AU0009`), or the project name if it is not in the registry yet.
      placeholder: AU0009
    validations:
      required: true

  - type: input
    id: pss_title
    attributes:
      label: PSS title
      description: As it should appear in the registry.
      placeholder: AU Core R3 PSS
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Release
      description: The release this PSS covers, as `R1`, `R2` and so on.
      placeholder: R3
    validations:
      required: true

  - type: input
    id: approved
    attributes:
      label: Work group approval date
      description: The date on the document — `YYYY-MM-DD`. This is the submitted date shown in the registry, and the date in the file name.
      placeholder: "2026-08-18"
    validations:
      required: true

  - type: input
    id: workgroup
    attributes:
      label: Work group
      placeholder: HL7 AU FHIR Work Group
    validations:
      required: true

  - type: textarea
    id: pdf
    attributes:
      label: PSS document
      description: >-
        Drag the approved scope statement into this box to attach it — GitHub
        replaces it with a link. It must be a **PDF**; a `.docx` is rejected and
        the submission comes back to you.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes for the TSC
      description: Anything the TSC should know — dependencies, ballot plans, related projects.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: The work group has approved this scope statement.
          required: true
        - label: The attached file is the approved PDF, not a draft or a Word document.
          required: true
