# No blank issues: every issue starts from one of the forms, so a submission
# always carries the metadata the registry needs.
blank_issues_enabled: false
contact_links:
  - name: Blank HL7 AU templates
    url: https://github.com/hl7au/hl7au-projects-registry/tree/main/TEMPLATES
    about: The fill-in PP, PSS and NIB forms to write on before you submit.
  - name: The project registry
    url: https://hl7au.github.io/hl7au-projects-registry/
    about: Every HL7 AU project, its scope statements and the documents behind them.
  # GitHub drops a contact link that is not http(s), so the TSC's address goes
  # in the "Something else" form rather than a mailto: link here.
  - name: How to submit — the co-chair guide
    url: https://github.com/hl7au/hl7au-projects-registry/blob/main/INSTRUCTIONS.md
    about: Preparing a PP or PSS from the templates, submitting it, and updating the PDF later.
