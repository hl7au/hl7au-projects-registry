name: Registry submission

# A "Submit a project proposal" or "Submit a project scope statement" issue
# becomes a pull request that adds the document to registry.md with status
# "Submitted", for the AU TSC.
#
# The issue body is untrusted input, so it is never interpolated into a shell
# command: the script reads it from a file and validates every field.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to process again
        required: true

concurrency:
  group: submission-${{ github.event.issue.number || inputs.issue }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'pss-submission') ||
      contains(github.event.issue.labels.*.name, 'pp-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          gh issue view "$NUMBER" --json body --jq '.body' > issue-body.md
          labels=$(gh issue view "$NUMBER" --json labels --jq '.labels[].name')
          case "$labels" in
            *pp-submission*) kind=pp ;;
            *pss-submission*) kind=pss ;;
            *) echo "::error::issue #$NUMBER is not a submission"; exit 1 ;;
          esac
          {
            echo "number=$NUMBER"
            echo "kind=$kind"
            echo "author=$(gh issue view "$NUMBER" --json author --jq '.author.login')"
          } >> "$GITHUB_OUTPUT"

      - name: Add the document to the registry
        id: apply
        env:
          KIND: ${{ steps.issue.outputs.kind }}
        run: |
          python "tools/${KIND}_from_issue.py" \
            --body issue-body.md \
            --summary pr-body.md >> "$GITHUB_OUTPUT" 2> apply.log
          cat apply.log

      - name: Check the registry still builds
        run: |
          python build.py | tee build.log
          if grep -q '^warning:' build.log; then
            echo "::error::the generated registry has warnings"
            exit 1
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
          KIND: ${{ steps.issue.outputs.kind }}
          AUTHOR: ${{ steps.issue.outputs.author }}
          PROJECT: ${{ steps.apply.outputs.project }}
          WHAT: ${{ steps.apply.outputs.what }}
        run: |
          branch="${KIND}/issue-$NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add registry.md PP PSS
          git commit -m "Add $PROJECT $WHAT from #$NUMBER"
          git push --force origin "$branch"
          {
            echo ""
            echo "Submitted by @$AUTHOR in #$NUMBER."
            echo ""
            echo "Closes #$NUMBER"
          } >> pr-body.md
          # Re-running an issue updates the existing pull request rather than
          # failing on a duplicate.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Add $PROJECT $WHAT (#$NUMBER)" \
              --body-file pr-body.md \
              --base main --head "$branch" \
              --label "${KIND}-submission"
          else
            gh pr edit "$branch" --body-file pr-body.md
          fi

      # GitHub does not run pull_request workflows for a pull request opened
      # with GITHUB_TOKEN, so build.yml never fires on these. Report the build
      # this job already ran as a commit status, so the pull request shows one.
      # A later push by a reviewer is an ordinary push and does trigger CI.
      - name: Report the build on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context='registry build' \
            -f description='registry.md builds with no warnings' \
            -f target_url="$RUN"

      - name: Tell the submitter what happened
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
          RESULT: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            printf 'Thanks — this submission is now a pull request for the AU TSC to review.\n' > comment.md
          else
            printf 'This submission could not be processed:\n\n```\n' > comment.md
            tail -c 2000 apply.log 2>/dev/null >> comment.md || true
            printf '\n```\n\nEdit the issue to fix it, then a maintainer can re-run the [workflow](%s).\n' "$RUN" >> comment.md
          fi
          gh issue comment "$NUMBER" --body-file comment.md
